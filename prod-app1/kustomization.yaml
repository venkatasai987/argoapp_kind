apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-app

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: sample-app-config
    namespace: sample-app
    files:
      - application.properties

generatorOptions:
  disableNameSuffixHash: true
